const stp=(id,f,v)=>`<div class=s><button data-a=st data-id="${id}" data-f=${f} data-d=-1>−</button><b>${v||0}</b><button data-a=st data-id="${id}" data-f=${f} data-d=1>+</button></div>`;

    const name=prompt('Nome da série',`Série ${n}`);if(!name)return;
    const img=(cov||fg[0]).set_img_url||'',b=db.batch(),ids=new Set();
    items['S'+n]?b.update(col().doc('S'+n),{name,img}):b.set(col().doc('S'+n),{t:'s',set:n,name,img,have:0,sell:0,price:0,buy:0});
    fg.forEach(x=>{const id=`F${n}_${x.set_num}`;ids.add(id);
      if(!items[id])b.set(col().doc(id),{t:'f',set:n,name:x.name,img:x.set_img_url||'',have:0,sell:0,price:0,buy:0})});
    Object.entries(items).filter(([i,x])=>x.t=='f'&&x.set==n&&!ids.has(i)&&!i.includes('_m')&&!(x.have||x.sell)).forEach(([i])=>b.delete(col().doc(i)));
    await b.commit();alert(`Série "${name}" pronta com ${fg.length} minifiguras.`);
  }catch(e){alert('Não consegui obter a série. Confirma o número (só os 5 dígitos, ex: 71045) e a chave Rebrickable.')}
}
const ok=c=>{if(!/^\d{13}$/.test(c))return false;let n=0;for(let i=0;i<12;i++)n+=+c[i]*(i%2?3:1);return(10-n%10)%10==+c[12]};
async function decodeFile(f){
  try{
    if('BarcodeDetector' in window){const d=new BarcodeDetector({formats:['ean_13']});const r=await d.detect(await createImageBitmap(f));const c=r.map(x=>x.rawValue).find(ok);if(c)return c}
    if(window.ZXing){const x=await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(URL.createObjectURL(f));if(ok(x.getText()))return x.getText()}
  }catch(e){}
  return null;
}
async function readCode(){
  const cam=$('#cam'),v=$('#vid');let st,res;
  try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}})}
  catch(e){alert('Sem acesso à câmara ('+e.name+'). No Chrome, permite a câmara para este site.');return prompt('Escreve o código de barras:')}
  try{const tr=st.getVideoTracks()[0],c=tr.getCapabilities?tr.getCapabilities():{};if(c.focusMode&&c.focusMode.includes('continuous'))tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
  cam.style.display='flex';v.srcObject=st;await v.play();
  const done=new Promise(x=>res=x);
  $('#stop').onclick=()=>res(null);$('#typ').onclick=()=>res(prompt('Escreve o código de barras:'));
  $('#picbtn').onclick=async()=>{try{
    const tr=st.getVideoTracks()[0];let blob;
    if('ImageCapture' in window){try{blob=await new ImageCapture(tr).takePhoto()}catch(e){}}
    if(!blob){const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);blob=await new Promise(x=>c.toBlob(x,'image/jpeg',.95))}
    const code=await decodeFile(blob);if(code)res(code);else alert('Não consegui ler o código. Aproxima só o código de barras e tenta de novo, ou usa Escrever.');
  }catch(e){alert('Erro ao capturar: '+e.name)}};
  v.onclick=()=>{try{const tr=st.getVideoTracks()[0];tr.applyConstraints({advanced:[{focusMode:'single-shot'}]}).then(()=>setTimeout(()=>tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{}),1500)).catch(()=>{})}catch(e){}};
  $('#galbtn').onclick=()=>$('#gal').click();
  $('#gal').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const c=await decodeFile(f);if(c)res(c);else alert('Não consegui ler o código nessa foto. Tira outra foto bem focada só ao código de barras.')};
  let d=null,zx=null;
  if('BarcodeDetector' in window)try{d=new BarcodeDetector({formats:['ean_13']})}catch(e){}
  const feed=c=>{if(ok(c))res(c)};
  const t=setInterval(async()=>{if(!d)return;try{const x=await d.detect(v);if(x[0])feed(x[0].rawValue)}catch(e){}},250);
  if(!d&&window.ZXing){try{zx=new ZXing.BrowserMultiFormatReader();zx.decodeFromVideoElement(v,x=>{if(x)feed(x.getText())})}catch(e){}}
  const code=await done;
  clearInterval(t);try{zx&&zx.reset()}catch(e){}st.getTracks().forEach(x=>x.stop());cam.style.display='none';return code;
}
async function scan(){const c=((await readCode())||'').trim();if(c)await handleCode(c)}
async function fromFile(f){const c=await decodeFile(f);if(c)return handleCode(c);const m=prompt('Não consegui ler o código na foto. Escreve os 13 dígitos por baixo das barras (ou cancela):');if(m)handleCode(m.trim())}
async function handleCode(code){
  if(!code)return;
  let set=codes[code];const isNew=!set;
  if(!set){
    const l=Object.values(items).filter(x=>x.t=='s').map(x=>x.set+' – '+x.name).join('\n');
    set=(prompt('Código lido: '+code+'\nEscreve o número da série a que pertence (ex: 71013):\n'+l)||'').trim().split('-')[0];if(!set)return;
  }
  if(!items['S'+set]){
    if(!confirm('A série '+set+' ainda não está na app. Adicionar agora?'))return;
    await addSeries(set);if(!items['S'+set])return;
  }
  if(isNew)db.collection('codes').doc(code).set({set});
  cur=set;view='detail';render();scrollTo(0,0);
}
async function openZoom(im){
  const z=$('#zoom'),zi=$('#zi'),it=items[im.dataset.z];
  const show=src=>{zi.onerror=null;zi.src=src;zi.style.visibility='visible'};
  z.style.display='flex';
  if(it&&it.t=='s'&&it.hasChk){
    zi.style.visibility='hidden';
    try{let c=chkCache[it.set];
      if(!c){const d=await db.collection('checks').doc(String(it.set)).get();c=d.exists?d.data().img:null;if(c)chkCache[it.set]=c}
      if(z.style.display=='flex')show(c||im.src)}catch(e){show(im.src)}
  }else if(it&&it.t=='s'&&(it.ck||CHK[it.set])){
    zi.style.visibility='visible';zi.onerror=()=>{zi.onerror=null;zi.src=im.src};zi.src=CK+(it.ck||CHK[it.set]);
  }else show(im.src);
}
async function setChk(f){
  try{
    const b=await createImageBitmap(f),m=Math.min(1,1200/Math.max(b.width,b.height));
    const c=document.createElement('canvas');c.width=Math.round(b.width*m);c.height=Math.round(b.height*m);
    c.getContext('2d').drawImage(b,0,0,c.width,c.height);
    const img=c.toDataURL('image/jpeg',.75);
    if(img.length>900000)return alert('A imagem é demasiado grande. Tenta uma foto mais pequena.');
    await db.collection('checks').doc(String(cur)).set({img});
    await col().doc('S'+cur).update({hasChk:true});
    chkCache[cur]=img;alert('Check list guardada. Toca na foto da série para a ver.');
  }catch(e){alert('Não consegui guardar a check list.')}
}
function chkDialog(){
  const it=items['S'+cur];if(!it)return;
  $('#chksel').innerHTML=SITE.map(([n,x])=>`<option value="${x}"${(it.ck||CHK[it.set])==x?' selected':''}>${n}</option>`).join('');
  $('#chkdlg').style.display='flex';
}
function manual(){
  const name=prompt('Nome da minifigura');if(!name)return;const img=prompt('URL da imagem (opcional)')||'';
  col().doc(`F${cur}_m${Date.now()}`).set({t:'f',set:cur,name,img,have:0,sell:0,price:0,buy:0});
}
function exp(){
  const rows=Object.entries(items).map(([id,x])=>({id,Tipo:x.t=='s'?'Série completa':'Minifigura',Serie:x.set,Nome:x.name,Imagem:x.img,Tenho:x.have,Vender:x.sell,Preco:x.price,Compra:x.buy}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Stock');XLSX.writeFile(wb,'minifiguras.xlsx');
}
async function imp(f){
  const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  let b=db.batch(),n=0;
  for(const r of rows){if(!r.id)continue;
    b.set(col().doc(String(r.id)),{t:r.Tipo=='Minifigura'?'f':'s',set:String(r.Serie),name:r.Nome||'',img:r.Imagem||'',have:+r.Tenho||0,sell:+r.Vender||0,price:+r.Preco||0,buy:+r.Compra||0});
    if(++n%400==0){await b.commit();b=db.batch()}}
  await b.commit();alert(n+' linhas importadas');
}
const A={
  st:d=>upd(d.id,d.f,+d.d),
  open:d=>{cur=d.set;view='detail';render();scrollTo(0,0)},
  pr:()=>{},bu:()=>{},photo:()=>$('#cap').click(),chk:chkDialog,gallery:()=>$('#gal2').click(),scan,add:addSeries,manual,exp,
  imp:()=>$('#file').click(),
  del:d=>{if(confirm('Apagar este item?'))col().doc(d.id).delete()},
  login:()=>firebase.auth().signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(e=>alert(e.message)),
  logout:()=>firebase.auth().signOut().then(()=>location.reload()),
  savecfg:async()=>{try{const t=$('#fb').value.trim().replace(/^[^{]*=/,'').replace(/;\s*$/,'');
    if(t)localStorage.fb=JSON.stringify(new Function('return ('+t+')')());
    const k=$('#rb').value.trim();localStorage.rb=k;
    if(db&&k)await db.collection('settings').doc('rb').set({key:k}).catch(()=>{});
    location.reload()}catch(e){alert('Configuração inválida')}}
};
document.addEventListener('click',e=>{
  if(e.target.closest('#zoom')){$('#zoom').style.display='none';return}
  const im=e.target.closest('.r img');if(im){openZoom(im);return}
  const b=e.target.closest('[data-a],[data-v]');if(!b)return;const d=b.dataset;
  if(d.v){view=d.v;cur=null;q='';return render()}
  A[d.a]&&A[d.a](d)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches&&e.target.matches('.r img'))e.target.click()});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d&&(d.a=='pr'||d.a=='bu')){const f=d.a=='pr'?'price':'buy',v=+e.target.value||0;col().doc(d.id).update({[f]:v});log(d.id,f,v)}});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;$('#list').innerHTML=list()}});
$('#file').onchange=e=>{if(e.target.files[0])imp(e.target.files[0]);e.target.value=''};
['cap','gal2'].forEach(i=>$('#'+i).onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)fromFile(f)});
$('#chkuse').onclick=async()=>{const x=$('#chksel').value;$('#chkdlg').style.display='none';try{await col().doc('S'+cur).update({ck:x,hasChk:false});alert('Check list escolhida. Toca na foto da série para a ver.')}catch(e){alert('Não consegui guardar.')}};
$('#chkgal').onclick=()=>{$('#chkdlg').style.display='none';$('#chkin').click()};
$('#chkx').onclick=()=>{$('#chkdlg').style.display='none'};
$('#chkin').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)setChk(f)};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
start();
</script></body></html>
