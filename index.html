<!doctype html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111827">
<title>Minifiguras</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#111827;color:#f3f4f6;padding-bottom:70px}
button,input,textarea{font:inherit;color:inherit;background:#1f2937;border:1px solid #374151;border-radius:10px;padding:10px 12px;min-height:44px}
button{cursor:pointer}button.p{background:#f59e0b;color:#111;border:0;font-weight:700}
:focus{outline:3px solid #facc15;outline-offset:2px}
#app{padding:12px;max-width:1100px;margin:auto}.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.bar input{flex:1;min-width:140px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:8px}.card img{width:100%;height:120px;object-fit:contain;background:#fff;border-radius:8px}
small{color:#9ca3af}.r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#1f2937;border-radius:12px;padding:8px;margin-bottom:8px}
.r img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:8px}.n{flex:1;min-width:120px;font-weight:600}
.c{display:flex;flex-direction:column;align-items:center}.c label{font-size:12px;color:#9ca3af}.s{display:flex;align-items:center;gap:6px}.s b{min-width:24px;text-align:center}
.r input[type=number]{width:80px}.x{padding:6px 10px;min-height:36px}.box{display:flex;flex-direction:column;gap:10px;max-width:420px;margin:30px auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1220;border-top:1px solid #374151}nav button{flex:1;border:0;border-radius:0;background:none}nav button.on{color:#f59e0b;font-weight:700}
#cam{position:fixed;inset:0;background:#000;z-index:9;display:none;flex-direction:column}#cam video{flex:1;width:100%;object-fit:cover}
textarea{width:100%;min-height:110px}.tot{font-weight:700;margin:8px 0}
</style></head><body>
<div id="app"></div>
<nav><button data-v="series">Séries</button><button data-v="all">Soltas</button><button data-v="sell">A vender</button><button data-v="log">Histórico</button><button data-v="cfg">Config</button></nav>
<div id="cam"><video id="vid" playsinline muted></video><button id="stop" class="p">Cancelar</button></div>
<input type="file" id="file" accept=".xlsx,.xls" hidden>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s),LS=k=>localStorage.getItem(k)||'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,items={},codes={},logs=[],view='series',cur=null,q='';
const col=()=>db.collection('items');
function start(){
  let c;try{c=JSON.parse(LS('fb'))}catch(e){}
  if(!c){view='cfg';return render()}
  firebase.initializeApp(c);
  firebase.auth().onAuthStateChanged(u=>{
    if(!u){view='login';return render()}
    db=firebase.firestore();db.enablePersistence().catch(()=>{});
    if(view=='login'||view=='cfg')view='series';
    col().onSnapshot(s=>{s.docChanges().forEach(h=>h.type=='removed'?delete items[h.doc.id]:items[h.doc.id]=h.doc.data());render()});
    db.collection('codes').onSnapshot(s=>s.forEach(d=>codes[d.id]=d.data().set));
    db.collection('log').orderBy('ts','desc').limit(100).onSnapshot(s=>{logs=s.docs.map(d=>d.data());if(view=='log')render()});
  });
}
const stp=(id,f,v)=>`<div class=s><button data-a=st data-id="${id}" data-f=${f} data-d=-1>−</button><b>${v||0}</b><button data-a=st data-id="${id}" data-f=${f} data-d=1>+</button></div>`;
const row=(id,x,label)=>`<div class=r><img src="${esc(x.img)}" loading=lazy onerror="this.style.visibility='hidden'"><div class=n>${esc(label||x.name)}<br><small>${esc(x.set)}</small></div>
<div class=c><label>Tenho</label>${stp(id,'have',x.have)}</div><div class=c><label>Vender</label>${stp(id,'sell',x.sell)}</div>
<div class=c><label>Compra €</label><input type=number step=0.01 inputmode=decimal value="${x.buy||0}" data-a=bu data-id="${id}"></div>
<div class=c><label>Venda €</label><input type=number step=0.01 inputmode=decimal value="${x.price||0}" data-a=pr data-id="${id}"></div>
<button class=x data-a=del data-id="${id}">✕</button></div>`;
const figs=(f)=>Object.entries(items).filter(([i,x])=>x.t=='f'&&f(x)).sort((a,b)=>a[1].name.localeCompare(b[1].name));
function list(){
  const t=q.toLowerCase();
  return figs(x=>!t||(x.name+' '+x.set).toLowerCase().includes(t)).slice(0,200).map(([i,x])=>row(i,x)).join('')||'<p>Nada encontrado.</p>';
}
function page(){
  if(view=='login')return `<div class=box><h2>Entrar</h2><input id=em type=email placeholder="Email"><input id=pw type=password placeholder="Palavra-passe"><button class=p data-a=login>Entrar</button></div>`;
  const all=Object.entries(items);
  if(view=='cfg')return `<div class=box><h2>Configuração</h2>
  <small>Config Firebase (cola o firebaseConfig)</small><textarea id=fb>${esc(LS('fb'))}</textarea>
  <small>Chave API Rebrickable</small><input id=rb value="${esc(LS('rb'))}">
  <button class=p data-a=savecfg>Guardar</button><hr style="width:100%;border-color:#374151">
  <button data-a=exp>⬇ Exportar Excel</button><button data-a=imp>⬆ Importar Excel</button><button data-a=logout>Terminar sessão</button></div>`;
  if(view=='series'){
    const S=all.filter(([i,x])=>x.t=='s').sort((a,b)=>String(a[1].set).localeCompare(b[1].set,0,{numeric:true}));
    return `<div class=bar><button class=p data-a=scan>📷 Ler código</button><button data-a=add>+ Série</button></div><div class=g>`+
    (S.map(([i,x])=>{const n=all.filter(([j,y])=>y.t=='f'&&y.set==x.set).reduce((s,[j,y])=>s+(y.have||0),0);
      return `<button class=card data-a=open data-set="${esc(x.set)}"><img src="${esc(x.img)}" onerror="this.style.visibility='hidden'"><b>${esc(x.name)}</b><small>${esc(x.set)} · completas ${x.have||0} · soltas ${n}</small></button>`}).join('')||'<p>Sem séries. Carrega em + Série.</p>')+`</div>`;
  }
  if(view=='detail'){const s=items['S'+cur];if(!s)return'';
    return `<div class=bar><button data-v=series>← Voltar</button><button data-a=manual>+ Minifigura manual</button></div>`+row('S'+cur,s,s.name+' (série completa)')+figs(x=>x.set==cur).map(([i,x])=>row(i,x)).join('');}
  if(view=='log'){const L={have:'Tenho',sell:'Vender',price:'Venda €',buy:'Compra €'};
    return logs.map(l=>`<div class=r><div class=n>${esc(l.n)}<br><small>${new Date(l.ts).toLocaleString('pt-PT')} · ${esc(l.u)}</small></div><b>${L[l.f]||l.f} ${l.f=='have'||l.f=='sell'?(l.d>0?'+':'')+l.d:'→ '+l.d}</b></div>`).join('')||'<p>Ainda sem histórico.</p>';}
  if(view=='all')return `<div class=bar><input id=q placeholder="Pesquisar minifigura ou série" value="${esc(q)}"></div><div id=list>${list()}</div>`;
  if(view=='sell'){const v=all.filter(([i,x])=>x.sell>0);const tot=v.reduce((s,[i,x])=>s+x.sell*(x.price||0),0);
    const lucro=v.reduce((s,[i,x])=>s+x.sell*((x.price||0)-(x.buy||0)),0);
    return `<div class=tot>Total à venda: ${tot.toFixed(2)} € · Lucro estimado: ${lucro.toFixed(2)} €</div>`+v.map(([i,x])=>row(i,x,x.t=='s'?x.name+' (série completa)':x.name)).join('')||'<p>Nada marcado para vender.</p>';}
}
function render(){
  const a=document.activeElement,key=e=>[e.dataset.a,e.dataset.id,e.dataset.f,e.dataset.d].join('|'),k=a&&a.dataset&&a.dataset.id?key(a):'';
  $('#app').innerHTML=page();
  if(k){const e=[...document.querySelectorAll('[data-id]')].find(e=>key(e)==k);e&&e.focus()}
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view||(view=='detail'&&b.dataset.v=='series')));
}
const who=()=>((firebase.auth().currentUser||{}).email||'?').split('@')[0];
const log=(id,f,d)=>db.collection('log').add({u:who(),n:items[id].name,f,d,ts:Date.now()});
const upd=(id,f,d)=>{const v=Math.max(0,(items[id][f]||0)+d);if(v==(items[id][f]||0))return;col().doc(id).update({[f]:v});log(id,f,v-(items[id][f]||0))};
async function addSeries(){
  const n=(prompt('Número da série (ex: 71045)')||'').trim().split('-')[0];if(!n)return;
  const key=LS('rb');if(!key)return alert('Põe a chave Rebrickable na Config.');
  try{
    const r=await fetch(`https://rebrickable.com/api/v3/lego/sets/?search=${n}&page_size=200`,{headers:{Authorization:'key '+key}});
    if(!r.ok)throw 0;
    const all=((await r.json()).results||[]).filter(x=>x.set_num.startsWith(n+'-'));
    const bad=/series|complete|sealed|box|random|bag|display/i;
    const fg=all.filter(x=>!bad.test(x.name)),cov=all.find(x=>bad.test(x.name));
    if(!fg.length)throw 0;
    const name=prompt('Nome da série',`Série ${n}`);if(!name)return;
    const img=(cov||fg[0]).set_img_url||'',b=db.batch(),ids=new Set();
    items['S'+n]?b.update(col().doc('S'+n),{name,img}):b.set(col().doc('S'+n),{t:'s',set:n,name,img,have:0,sell:0,price:0,buy:0});
    fg.forEach(x=>{const id=`F${n}_${x.set_num}`;ids.add(id);
      if(!items[id])b.set(col().doc(id),{t:'f',set:n,name:x.name,img:x.set_img_url||'',have:0,sell:0,price:0,buy:0})});
    Object.entries(items).filter(([i,x])=>x.t=='f'&&x.set==n&&!ids.has(i)&&!i.includes('_m')&&!(x.have||x.sell)).forEach(([i])=>b.delete(col().doc(i)));
    await b.commit();alert(`Série "${name}" pronta com ${fg.length} minifiguras.`);
  }catch(e){alert('Não consegui obter a série. Confirma o número (só os 5 dígitos, ex: 71045) e a chave Rebrickable.')}
}
async function scan(){
  let code;
  if('BarcodeDetector' in window){
    try{
      const d=new BarcodeDetector(),v=$('#vid'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      $('#cam').style.display='flex';v.srcObject=st;await v.play();
      code=await new Promise(res=>{const t=setInterval(async()=>{try{const r=await d.detect(v);if(r[0]){clearInterval(t);res(r[0].rawValue)}}catch(e){}},300);
        $('#stop').onclick=()=>{clearInterval(t);res(null)}});
      st.getTracks().forEach(t=>t.stop());$('#cam').style.display='none';
    }catch(e){$('#cam').style.display='none';code=prompt('Código de barras:')}
  }else code=prompt('Código de barras:');
  if(!code)return;
  let set=codes[code];
  if(!set){
    const l=Object.values(items).filter(x=>x.t=='s').map(x=>x.set+' – '+x.name).join('\n');
    set=(prompt('Código novo. Escreve o número da série a que pertence:\n'+l)||'').trim();if(!set)return;
    if(!items['S'+set])return alert('Essa série ainda não existe. Adiciona-a primeiro.');
    db.collection('codes').doc(code).set({set});
  }
  cur=set;view='detail';render();scrollTo(0,0);
}
function manual(){
  const name=prompt('Nome da minifigura');if(!name)return;const img=prompt('URL da imagem (opcional)')||'';
  col().doc(`F${cur}_m${Date.now()}`).set({t:'f',set:cur,name,img,have:0,sell:0,price:0,buy:0});
}
function exp(){
  const rows=Object.entries(items).map(([id,x])=>({id,Tipo:x.t=='s'?'Série completa':'Minifigura',Serie:x.set,Nome:x.name,Imagem:x.img,Tenho:x.have,Vender:x.sell,Preco:x.price,Compra:x.buy}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Stock');XLSX.writeFile(wb,'minifiguras.xlsx');
}
async function imp(f){
  const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  let b=db.batch(),n=0;
  for(const r of rows){if(!r.id)continue;
    b.set(col().doc(String(r.id)),{t:r.Tipo=='Minifigura'?'f':'s',set:String(r.Serie),name:r.Nome||'',img:r.Imagem||'',have:+r.Tenho||0,sell:+r.Vender||0,price:+r.Preco||0,buy:+r.Compra||0});
    if(++n%400==0){await b.commit();b=db.batch()}}
  await b.commit();alert(n+' linhas importadas');
}
const A={
  st:d=>upd(d.id,d.f,+d.d),
  open:d=>{cur=d.set;view='detail';render();scrollTo(0,0)},
  pr:()=>{},bu:()=>{},scan,add:addSeries,manual,exp,
  imp:()=>$('#file').click(),
  del:d=>{if(confirm('Apagar este item?'))col().doc(d.id).delete()},
  login:()=>firebase.auth().signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(e=>alert(e.message)),
  logout:()=>firebase.auth().signOut().then(()=>location.reload()),
  savecfg:()=>{try{const t=$('#fb').value.trim().replace(/^[^{]*=/,'').replace(/;\s*$/,'');
    if(t)localStorage.fb=JSON.stringify(new Function('return ('+t+')')());localStorage.rb=$('#rb').value.trim();location.reload()}catch(e){alert('Configuração inválida')}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-v]');if(!b)return;const d=b.dataset;
  if(d.v){view=d.v;cur=null;q='';return render()}
  A[d.a]&&A[d.a](d)});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d&&(d.a=='pr'||d.a=='bu')){const f=d.a=='pr'?'price':'buy',v=+e.target.value||0;col().doc(d.id).update({[f]:v});log(d.id,f,v)}});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;$('#list').innerHTML=list()}});
$('#file').onchange=e=>{if(e.target.files[0])imp(e.target.files[0]);e.target.value=''};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
start();
</script></body></html>
