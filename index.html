<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Minifiguras</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#111827;color:#f3f4f6;padding-bottom:70px}
button,input,textarea,select{font:inherit;color:inherit;background:#1f2937;border:1px solid #374151;border-radius:10px;padding:10px 12px;min-height:44px}
button{cursor:pointer}button.p{background:#f59e0b;color:#111;border:0;font-weight:700}
:focus{outline:3px solid #facc15;outline-offset:2px}
#app{padding:12px;max-width:1100px;margin:auto}.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.bar input{flex:1;min-width:140px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:8px}.card img{width:100%;height:120px;object-fit:contain;background:#fff;border-radius:8px}
small{color:#9ca3af}.r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#1f2937;border-radius:12px;padding:8px;margin-bottom:8px}
.r img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:8px}.n{flex:1;min-width:120px;font-weight:600}
.c{display:flex;flex-direction:column;align-items:center}.c label{font-size:12px;color:#9ca3af}.s{display:flex;align-items:center;gap:6px}.s b{min-width:24px;text-align:center}
.r input[type=number]{width:80px}.x{padding:6px 10px;min-height:36px}.box{display:flex;flex-direction:column;gap:10px;max-width:420px;margin:30px auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1220;border-top:1px solid #374151}nav button{flex:1;border:0;border-radius:0;background:none}nav button.on{color:#f59e0b;font-weight:700}
#cam{position:fixed;inset:0;height:100dvh;overflow:hidden;background:#000;z-index:9;display:none;flex-direction:column}#cam video{flex:none;height:45dvh;width:100%;object-fit:cover}
textarea{width:100%;min-height:110px}.tot{font-weight:700;margin:8px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ef4444;margin-left:6px;vertical-align:middle}
.sw{display:flex;align-items:center;gap:10px;width:100%;text-align:left}.sw i{width:42px;height:24px;border-radius:12px;background:#374151;position:relative;flex:none}
.sw i:after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.sw.on i{background:#f59e0b}.sw.on i:after{left:21px}.sw span{flex:1}
#toast{display:none;position:fixed;left:12px;right:12px;bottom:80px;z-index:12;background:#ef4444;color:#fff;border-radius:10px;padding:12px;font-weight:600;text-align:center}

async function autoFill(){
  if(autoDone||!db)return;autoDone=true;
  try{const d=await db.collection('settings').doc('autofill').get();if(d.exists)return;
    const r=await fillBuy(Object.values(items).filter(x=>x.t=='s').map(x=>x.set));
    await db.collection('settings').doc('autofill').set({v:24,ts:Date.now(),n:r.n});
    if(r.n)alert('Preços de compra preenchidos automaticamente ('+r.n+' itens), com o PVP base de cada set.');
  }catch(e){}
}
async function fillBuy(sets){
  let b=db.batch(),n=0,p=0;const miss=[];
  for(const k of sets){const pr=baseOf(k);if(!pr){miss.push((items['S'+k]||{}).name||k);continue}
    let nf=0;
    for(const [i,x] of Object.entries(items)){if(x.t=='f'&&String(x.set)==String(k)){nf++;if(!(x.buy>0)){b.update(col().doc(i),{buy:pr});n++;if(++p==400){await b.commit();b=db.batch();p=0}}}}
    const S=items['S'+k];if(S&&nf&&!(S.buy>0)){b.update(col().doc('S'+k),{buy:Math.round(nf*pr*100)/100});n++;if(++p==400){await b.commit();b=db.batch();p=0}}}
  if(p)await b.commit();
  return {n,miss};
}

const LGTOP=all=>`<div style="font-size:12px;opacity:.75;margin:2px 4px 8px">Total: Sets Lego ${all.reduce((n,[i,x])=>n+(x.have||0),0)} · Investido ${eur(all.reduce((n,[i,x])=>n+(x.have||0)*(x.buy||0),0))}</div><div class=bar><button class=p data-a=addlego>+ Set Lego</button></div>`;
const stp=(id,f,v)=>`<div class=s><button data-a=st data-id="${id}" data-f=${f} data-d=-1>−</button><b>${v||0}</b><button data-a=st data-id="${id}" data-f=${f} data-d=1>+</button></div>`;
const numOf=id=>{const m=String(id).match(/_\d+-(\d+)$/);return m?+m[1]:null};
const ysfx=x=>{const y=x.year||(items['S'+x.set]||{}).year;return y?` (${y})`:''};
const dot=x=>(x.have>0&&(x.sell||0)>=x.have)?'<span class=dot role=img aria-label="Todas à venda" title="Todas à venda"></span>':'';
const nm=(id,x,label)=>{const s=label||((x.t=='f'&&numOf(id)!=null?numOf(id)+'. ':'')+x.name);return x.t=='b'&&!s.startsWith('📦')?'📦 '+s:s};
const row=(id,x,label)=>`<div class=r><img tabindex=0 data-z="${esc(id)}" src="${esc(x.img)}" loading=lazy onerror="this.style.visibility='hidden'"><div class=n>${esc(nm(id,x,label))}${dot(x)}<br><small>${esc(x.set+ysfx(x)+(x.theme?' · '+x.theme:''))}</small></div>
<div class=c><label>Tenho</label>${stp(id,'have',x.have)}</div><div class=c><label>Vender</label>${stp(id,'sell',x.sell)}</div>
<div class=c><label>Compra €</label><input type=number step=0.01 inputmode=decimal value="${x.buy||0}" data-a=bu data-id="${id}"></div>

function list(){
  const t=q.toLowerCase(),lim=sec=='lg'?400:200;
  const arr=figs(x=>(!t||[x.name,x.set,x.box,x.loc,x.theme].join(' ').toLowerCase().includes(t))&&(!onlyFree||((x.have||0)>0&&!(x.sell>0))));

}

async function addSeries(pre){
  const n=String(typeof pre=='string'?pre:(prompt('Número do set (ex: 71045)')||'')).trim().split('-')[0];if(!n)return;
  const key=LS('rb')||rbShared;if(!key)return alert('Põe a chave Rebrickable na Config.');
  try{
    const r=await fetch(`https://rebrickable.com/api/v3/lego/sets/?search=${n}&page_size=200`,{headers:{Authorization:'key '+key}});
    if(!r.ok)throw 0;
    const all=((await r.json()).results||[]).filter(x=>x.set_num.startsWith(n+'-'));
    const bad=/series|complete|sealed|box|random|bag|display/i;
    const fg=all.filter(x=>!bad.test(x.name)),cov=all.find(x=>bad.test(x.name));
    if(!fg.length)throw 0;
    const name=prompt('Nome do set',`Set ${n}`);if(!name)return;
    const img=(cov||fg[0]).set_img_url||'',yr=Math.min(...all.map(x=>x.year||9999).concat(9999))%9999||0,b=db.batch(),ids=new Set();
    items['S'+n]?b.update(col().doc('S'+n),{name,img,year:yr}):b.set(col().doc('S'+n),{t:'s',set:n,name,img,year:yr,have:0,sell:0,price:0,buy:0});
    fg.forEach(x=>{const id=`F${n}_${x.set_num}`;ids.add(id);
      items[id]?b.update(col().doc(id),{year:x.year||0}):b.set(col().doc(id),{t:'f',set:n,name:x.name,img:x.set_img_url||'',year:x.year||0,have:0,sell:0,price:0,buy:BASE[n]||0})});
    Object.entries(items).filter(([i,x])=>x.t=='f'&&x.set==n&&!ids.has(i)&&!i.includes('_m')&&!(x.have||x.sell)).forEach(([i])=>b.delete(col().doc(i)));
    await b.commit();alert(`Set "${name}" pronto com ${fg.length} minifiguras.`);
  }catch(e){alert('Não consegui obter o set. Confirma o número (só os 5 dígitos, ex: 71045) e a chave Rebrickable.')}
}
const ok=c=>{if(!/^\d{13}$/.test(c))return false;let n=0;for(let i=0;i<12;i++)n+=+c[i]*(i%2?3:1);return(10-n%10)%10==+c[12]};
async function decodeFile(f){
  try{
    if('BarcodeDetector' in window){const d=new BarcodeDetector({formats:['ean_13']});const r=await d.detect(await createImageBitmap(f));const c=r.map(x=>x.rawValue).find(ok);if(c)return c}
    if(window.ZXing){const x=await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(URL.createObjectURL(f));if(ok(x.getText()))return x.getText()}
  }catch(e){}
  return null;
}

  catch(e){alert('Sem acesso à câmara ('+e.name+'). No Chrome, permite a câmara para este site.');return prompt('Escreve o código de barras:')}
  try{const tr=st.getVideoTracks()[0],c=tr.getCapabilities?tr.getCapabilities():{};if(c.focusMode&&c.focusMode.includes('continuous'))tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
  cam.style.display='flex';v.srcObject=st;await v.play();
  const done=new Promise(x=>res=x);
  $('#stop').onclick=()=>res(null);$('#typ').onclick=()=>res(prompt('Escreve o código de barras:'));
  $('#picbtn').onclick=async()=>{try{
    const tr=st.getVideoTracks()[0];let blob;
    if('ImageCapture' in window){try{blob=await new ImageCapture(tr).takePhoto()}catch(e){}}
    if(!blob){const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);blob=await new Promise(x=>c.toBlob(x,'image/jpeg',.95))}
    const code=await decodeFile(blob);if(code)res(code);else alert('Não consegui ler o código. Aproxima só o código de barras e tenta de novo, ou usa Escrever.');
  }catch(e){alert('Erro ao capturar: '+e.name)}};
  v.onclick=()=>{try{const tr=st.getVideoTracks()[0];tr.applyConstraints({advanced:[{focusMode:'single-shot'}]}).then(()=>setTimeout(()=>tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{}),1500)).catch(()=>{})}catch(e){}};
  $('#galbtn').onclick=()=>$('#gal').click();
  $('#gal').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const c=await decodeFile(f);if(c)res(c);else alert('Não consegui ler o código nessa foto. Tira outra foto bem focada só ao código de barras.')};
  let d=null,zx=null;
  if('BarcodeDetector' in window)try{d=new BarcodeDetector({formats:['ean_13']})}catch(e){}
  const feed=c=>{if(ok(c))res(c)};
  const t=setInterval(async()=>{if(!d)return;try{const x=await d.detect(v);if(x[0])feed(x[0].rawValue)}catch(e){}},250);
  if(!d&&window.ZXing){try{zx=new ZXing.BrowserMultiFormatReader();zx.decodeFromVideoElement(v,x=>{if(x)feed(x.getText())})}catch(e){}}
  const code=await done;
  clearInterval(t);try{zx&&zx.reset()}catch(e){}st.getTracks().forEach(x=>x.stop());cam.style.display='none';return code;
}
async function scan(){const c=((await readCode())||'').trim();if(c)await handleCode(c)}
async function fromFile(f){const c=await decodeFile(f);if(c)return handleCode(c);const m=prompt('Não consegui ler o código na foto. Escreve os 13 dígitos por baixo das barras (ou cancela):');if(m)handleCode(m.trim())}
async function handleCode(code){
  if(!code)return;
  let set=codes[code];const isNew=!set;
  if(!set){
    const l=Object.values(items).filter(x=>x.t=='s').map(x=>x.set+' – '+x.name).join('\n');
    set=(prompt('Código lido: '+code+'\nEscreve o número do set a que pertence (ex: 71013):\n'+l)||'').trim().split('-')[0];if(!set)return;
  }
  if(!items['S'+set]){
    if(!confirm('O set '+set+' ainda não está na app. Adicionar agora?'))return;
    await addSeries(set);if(!items['S'+set])return;
  }
  if(isNew)db.collection('codes').doc(code).set({set});
  cur=set;view='detail';render();scrollTo(0,0);
}
async function openZoom(im){
  const z=$('#zoom'),zi=$('#zi'),it=items[im.dataset.z];
  const show=src=>{zi.onerror=null;zi.src=src;zi.style.visibility='visible'};
  z.style.display='flex';
  if(it&&it.t=='s'&&it.hasChk){
    zi.style.visibility='hidden';
    try{let c=chkCache[it.set];
      if(!c){const d=await db.collection('checks').doc(String(it.set)).get();c=d.exists?d.data().img:null;if(c)chkCache[it.set]=c}
      if(z.style.display=='flex')show(c||im.src)}catch(e){show(im.src)}
  }else if(it&&it.t=='s'&&(it.ck||CHK[it.set])){
    zi.style.visibility='visible';zi.onerror=()=>{zi.onerror=null;zi.src=im.src};zi.src=CK+(it.ck||CHK[it.set]);
  }else show(im.src);
}
async function setChk(f){
  try{
    const b=await createImageBitmap(f),m=Math.min(1,1200/Math.max(b.width,b.height));
    const c=document.createElement('canvas');c.width=Math.round(b.width*m);c.height=Math.round(b.height*m);
    c.getContext('2d').drawImage(b,0,0,c.width,c.height);
    const img=c.toDataURL('image/jpeg',.75);
    if(img.length>900000)return alert('A imagem é demasiado grande. Tenta uma foto mais pequena.');
    await db.collection('checks').doc(String(cur)).set({img});
    await col().doc('S'+cur).update({hasChk:true});
    chkCache[cur]=img;alert('Check list guardada. Toca na foto do set para a ver.');
  }catch(e){alert('Não consegui guardar a check list.')}
}
function chkDialog(){
  const it=items['S'+cur];if(!it)return;
  $('#chksel').innerHTML=SITE.map(([n,x])=>`<option value="${x}"${(it.ck||CHK[it.set])==x?' selected':''}>${n}</option>`).join('');
  $('#chkdlg').style.display='flex';
}
function manual(){
  const name=prompt('Nome da minifigura');if(!name)return;const img=prompt('URL da imagem (opcional)')||'';
  col().doc(`F${cur}_m${Date.now()}`).set({t:'f',set:cur,name,img,have:0,sell:0,price:0,buy:baseOf(cur)});
}
function box(){
  const s=items['S'+cur],name=prompt('Nome da caixa selada',`Caixa selada – ${s?s.name:cur}`);if(!name)return;
  col().doc(`B${cur}_${Date.now()}`).set({t:'b',set:cur,name,img:(s&&s.img)||'',have:0,sell:0,price:0,buy:0});
}
const PVP={};// PVP por set Lego (€), ex: PVP['10497']=99.99
async function addLego(){
  const raw=(prompt('Número do set Lego (ex: 10497)')||'').trim();if(!raw)return;
  const n=raw.split('-')[0],full=raw.includes('-')?raw:n+'-1',set=full.endsWith('-1')?n:full;
  const lines=Object.values(items).filter(x=>x.t=='l'&&String(x.set)==set),base=lines[0];
  if(base){
    if(!confirm('Já tens o set '+set+' ('+lines.length+(lines.length>1?' linhas':' linha')+'). Adicionar outra linha (outra caixa/local)?'))return;
    try{await col().doc(`L${full}_${Date.now()}`).set({t:'l',set,name:base.name,img:base.img||'',year:base.year||0,theme:base.theme||'',have:0,sell:0,price:base.price||0,buy:base.buy||0,box:'',loc:''});
      onlyFree=false;localStorage['free_lg']='';render();toast('Nova linha do set '+set+' criada. Preenche a Caixa e o Local.',1)}
    catch(e){alert('Não consegui guardar: '+e.message)}
    return;
  }
  const id='L'+full,key=LS('rb')||rbShared;let d=null;
  if(key){try{const r=await fetch(`https://rebrickable.com/api/v3/lego/sets/${encodeURIComponent(full)}/`,{headers:{Authorization:'key '+key}});if(r.ok)d=await r.json()}catch(e){}}
  let name,img,year;
  if(d){name=prompt('Nome do set',d.name);if(!name)return;img=d.set_img_url||'';year=d.year||0}
  else{if(!confirm('Não consegui obter o set '+set+' no Rebrickable (confirma o número e a chave na Config). Adicionar à mão?'))return;
    name=prompt('Nome do set');if(!name)return;img=prompt('URL da imagem (opcional)')||'';year=+prompt('Ano (opcional)')||0}
  const pv=prompt('Preço de compra / PVP em € (opcional).\nVai para o "Compra €" deste set:',PVP[set]||'');
  const buy=pv===null?0:(+String(pv).replace(',','.')||0);
  try{await col().doc(id).set({t:'l',set,name,img,year,have:0,sell:0,price:0,buy,box:'',loc:''});onlyFree=false;localStorage['free_lg']='';render();toast('Set '+set+' guardado. Preenche a Caixa e o Local.',1)}
  catch(e){alert('Não consegui guardar: '+e.message)}
}
function exp(){
  const rows=Object.entries(items).map(([id,x])=>({id,Tipo:x.t=='s'?'Série completa':x.t=='b'?'Caixa selada':x.t=='l'?'Set Lego':'Minifigura',Serie:x.set,Nome:x.name,Imagem:x.img,Tenho:x.have,Vender:x.sell,Preco:x.price,Compra:x.buy,Ano:x.year||'',...(x.t=='l'?{Caixa:x.box||'',Local:x.loc||'',Tema:x.theme||''}:{})}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Stock');XLSX.writeFile(wb,sec=='lg'?'sets_lego.xlsx':'minifiguras.xlsx');
}
async function imp(f){
  const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  let b=db.batch(),n=0;
  for(const r of rows){if(!r.id)continue;if((r.Tipo=='Set Lego')!=(sec=='lg'))continue;
    b.set(col().doc(String(r.id)),{t:r.Tipo=='Set Lego'?'l':r.Tipo=='Minifigura'?'f':r.Tipo=='Caixa selada'?'b':'s',set:String(r.Serie),name:r.Nome||'',img:r.Imagem||'',have:+r.Tenho||0,sell:Math.min(+r.Vender||0,+r.Tenho||0),price:+r.Preco||0,buy:+r.Compra||0,year:+r.Ano||0,...(sec=='lg'?{box:String(r.Caixa??''),loc:String(r.Local??''),theme:String(r.Tema??'')}:{})});
    if(++n%400==0){await b.commit();b=db.batch()}}
  await b.commit();alert(n+' linhas importadas');
}
const A={
  st:d=>upd(d.id,d.f,+d.d),
  enter:d=>enter(d.s),home:goHome,addlego:addLego,
  open:d=>{cur=d.set;view='detail';render();scrollTo(0,0)},
  pr:()=>{},bu:()=>{},photo:()=>$('#cap').click(),chk:chkDialog,gallery:()=>$('#gal2').click(),scan,add:addSeries,manual,box,exp,
  base:async()=>{const cu=baseOf(cur),v=prompt('Preço base por saco (€) deste set.\nVai para o "Compra €" das minifiguras que ainda têm 0:',cu||'');if(v===null)return;
    const pr=+String(v).replace(',','.');if(!(pr>0))return alert('Valor inválido.');
    await col().doc('S'+cur).update({base:pr});const r=await fillBuy([cur]);alert(r.n+' minifiguras actualizadas com '+pr.toFixed(2)+' €.')},
  fillall:async()=>{if(!confirm('Preencher o "Compra €" de todas as minifiguras que estão a 0, com o PVP base do set (USD = EUR)? Os que já têm preço não são alterados.'))return;
    const r=await fillBuy(Object.values(items).filter(x=>x.t=='s').map(x=>x.set));
    alert(r.n+' minifiguras actualizadas.'+(r.miss.length?'\n\nSem preço base (define em cada set com 💰 Preço base):\n'+r.miss.join('\n'):''))},free:()=>{onlyFree=!onlyFree;localStorage['free_'+sec]=onlyFree?'1':'';render()},
  imp:()=>$('#file').click(),
  del:d=>{if(confirm('Apagar este item?'))col().doc(d.id).delete()},
  login:()=>firebase.auth().signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(e=>alert(e.message)),
  logout:()=>firebase.auth().signOut().then(()=>location.reload()),
  savecfg:async()=>{try{const t=$('#fb').value.trim().replace(/^[^{]*=/,'').replace(/;\s*$/,'');
    if(t)localStorage.fb=JSON.stringify(new Function('return ('+t+')')());
    const k=$('#rb').value.trim();localStorage.rb=k;
    if(db&&k)await db.collection('settings').doc('rb').set({key:k}).catch(()=>{});
    location.reload()}catch(e){alert('Configuração inválida')}}
};
document.addEventListener('click',e=>{
  if(e.target.closest('#zoom')){$('#zoom').style.display='none';return}
  const im=e.target.closest('.r img,img.zm');if(im){openZoom(im);return}
  const b=e.target.closest('[data-a],[data-v]');if(!b)return;const d=b.dataset;
  if(d.v){view=d.v;cur=null;q='';return render()}
  A[d.a]&&A[d.a](d)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches&&e.target.matches('.r img,img.zm'))e.target.click()});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d&&(d.a=='bx'||d.a=='lc')){col().doc(d.id).update({[d.a=='bx'?'box':'loc']:e.target.value.trim()});return}if(d&&(d.a=='pr'||d.a=='bu')){const f=d.a=='pr'?'price':'buy',v=+e.target.value||0;col().doc(d.id).update({[f]:v});log(d.id,f,v)}});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;$('#list').innerHTML=list()}});
$('#file').onchange=e=>{if(e.target.files[0])imp(e.target.files[0]);e.target.value=''};
['cap','gal2'].forEach(i=>$('#'+i).onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)fromFile(f)});
$('#chkuse').onclick=async()=>{const x=$('#chksel').value;$('#chkdlg').style.display='none';try{await col().doc('S'+cur).update({ck:x,hasChk:false});alert('Check list escolhida. Toca na foto do set para a ver.')}catch(e){alert('Não consegui guardar.')}};
$('#chkgal').onclick=()=>{$('#chkdlg').style.display='none';$('#chkin').click()};
$('#chkx').onclick=()=>{$('#chkdlg').style.display='none'};
$('#chkin').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)setChk(f)};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
start();
